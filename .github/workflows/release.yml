name: Release

# Builds, signs, notarises and publishes AudioSwitch when a version tag is
# pushed, then commits the regenerated Sparkle appcast back to main so existing
# installs can see the update.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64    base64 of the "Developer ID Application" .p12 export
#   MACOS_CERT_PASSWORD      password protecting that .p12
#   APPLE_ID                 Apple ID used for notarisation
#   APPLE_ID_PASSWORD        app-specific password for that Apple ID
#   APPLE_TEAM_ID            10-character Apple Developer Team ID
#   SPARKLE_ED_PRIVATE_KEY   Sparkle EdDSA private key (generate_keys -x)
# Optional:
#   MACOS_SIGN_IDENTITY      full identity string; auto-detected when unset

on:
  push:
    tags:
      - "v*"
  # Manual run builds and signs for verification but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write # for `gh release create` and the appcast commit

jobs:
  release:
    # macos-14 ships Swift 5.10; Package.swift declares swift-tools-version 6.0.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain keeps the runner's default one untouched and
          # avoids the interactive prompt codesign would otherwise raise.
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks waiting for keychain authorisation.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Resolve signing identity
        env:
          OVERRIDE_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_IDENTITY:-}" ]; then
            IDENTITY="$OVERRIDE_IDENTITY"
          else
            IDENTITY=$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" \
              | grep "Developer ID Application" | head -1 \
              | sed -E 's/.*"(.*)"/\1/')
          fi
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Write Sparkle private key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Supplying the key as a file avoids sign_update's keychain lookup,
          # which cannot be answered on a headless runner.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed.key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle_ed.key" >> "$GITHUB_ENV"

      - name: Build, notarise and update appcast
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual runs are dispatched against a branch, so GITHUB_REF_NAME is
            # a branch name. Verify whatever version is currently committed.
            VERSION=$(plutil -extract CFBundleShortVersionString raw packaging/Info.plist)
          fi
          echo "Building version $VERSION"
          # Tags cut from a release commit already carry the right version, so
          # release.sh leaves Info.plist alone in that case.
          ./release.sh "$VERSION"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f AudioSwitch.zip
          gh release create "$GITHUB_REF_NAME" AudioSwitch.zip \
            --title "AudioSwitch ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Commit appcast to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # The feed URL points at main, so the appcast has to land there for
          # installed copies to see the release.
          #
          # The freshly signed appcast only exists in the working tree at this
          # point — the tag still carries the previous one. Stash it outside the
          # repo so switching branches cannot clobber it.
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          cp packaging/Info.plist "$RUNNER_TEMP/Info.plist"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          cp "$RUNNER_TEMP/Info.plist" packaging/Info.plist
          git add appcast.xml packaging/Info.plist
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: appcast for ${GITHUB_REF_NAME}"
          git push origin main
